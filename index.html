<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt Messenger 11</title>
    <style>
        body {
            background: #0d0d12;
            color: #f0f0f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            background: rgba(26, 26, 33, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>Подключение к Volt...</h2>
        <p style="color: #8e8e99; font-size: 13px; margin-top: 8px;">Обходим проверку и открываем сервер...</p>
    </div>

    <script>
        // Использование фиксированного поддомена Localtunnel решает проблему с обновлением ссылки
        // Пример запуска на ПК: lt --port 5000 --subdomain myvoltchat
        const LOCAL_TUNNEL_URL = "https://volt.loca.lt";

        async function bypassAndRedirect() {
            try {
                // Делаем скрытый запрос с заголовком обхода IP перед редиректом
                await fetch(LOCAL_TUNNEL_URL, {
                    method: 'GET',
                    mode: 'no-cors',
                    headers: {
                        'Bypass-Tunnel-Reminder': 'true'
                    }
                });
            } catch (e) {
                // Игнорируем сетевые ограничения CORS, нам важно лишь отправить заголовок
            }

            // Мгновенный переход на сам туннель уже без экрана ввода IP
            window.location.replace(LOCAL_TUNNEL_URL);
        }

        bypassAndRedirect();
    </script>
</body>
</html>

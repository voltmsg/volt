<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Volt Messenger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-glass: rgba(18, 18, 22, 0.82);
            --border-glass: rgba(255, 255, 255, 0.15);
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.3);
            --text-main: #f0f0f5;
            --text-muted: #8e8e99;
            --panel-bg: rgba(26, 26, 33, 0.65);
            --input-bg: rgba(15, 15, 20, 0.65);
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 20%, #1a1a2e 0%, #0d0d12 100%);
            color: var(--text-main);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Glassmorphism Window Container */
        .glass-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: none;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .glass-container {
                width: 960px;
                height: 640px;
                border-radius: 8px;
                border: 1px solid var(--border-glass);
                box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            }
        }

        /* Title Bar */
        .titlebar {
            height: 44px;
            background: rgba(10, 10, 15, 0.85);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            user-select: none;
            flex-shrink: 0;
        }

        .titlebar-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .titlebar-title span {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .tb-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .tb-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        /* Screens */
        .screen {
            flex: 1;
            display: none;
            overflow: hidden;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        /* Auth Screen */
        #auth-screen {
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 340px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glass);
            border-radius: 6px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .auth-box h2 {
            font-size: 20px;
            font-weight: 500;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--border-glass);
            border-radius: 4px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .btn {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .auth-switch {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            cursor: pointer;
        }

        .auth-switch span {
            color: var(--accent);
            text-decoration: underline;
        }

        .error-msg {
            font-size: 12px;
            color: #ff5c5c;
            text-align: center;
        }

        /* Messenger Layout */
        #messenger-screen {
            flex-direction: row;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 100%;
            height: 100%;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        @media (min-width: 768px) {
            .sidebar {
                width: 320px;
            }
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            background: #2a2a38;
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--accent);
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            flex: 1;
            overflow: hidden;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-uid-badge {
            font-size: 11px;
            color: var(--text-muted);
        }

        .sidebar-actions {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            cursor: pointer;
        }

        .contact-item:hover, .contact-item.active {
            background: rgba(255, 255, 255, 0.08);
        }

        .contact-details {
            flex: 1;
            overflow: hidden;
        }

        .contact-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .contact-status {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: none;
            flex-direction: column;
            background: rgba(10, 10, 14, 0.65);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        @media (min-width: 768px) {
            .chat-area {
                position: relative;
                display: flex;
            }
        }

        .chat-area.mobile-active {
            display: flex;
        }

        .chat-header {
            padding: 10px 16px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        @media (min-width: 768px) {
            .back-btn {
                display: none;
            }
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            border: 1px solid var(--border-glass);
        }

        .message.incoming {
            background: rgba(255, 255, 255, 0.07);
            align-self: flex-start;
        }

        .message.outgoing {
            background: rgba(0, 210, 255, 0.15);
            border-color: rgba(0, 210, 255, 0.35);
            align-self: flex-end;
        }

        .message-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-area {
            padding: 12px 16px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-glass);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
        }

        /* Profile Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: 90%;
            max-width: 320px;
            background: #181822;
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .avatar-preview {
            width: 72px;
            height: 72px;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            background: #22222e;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .empty-placeholder {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            gap: 8px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <!-- Titlebar -->
        <div class="titlebar">
            <div class="titlebar-title"><span>Volt</span> // Messenger</div>
            <div class="titlebar-controls">
                <button class="tb-btn" onclick="logout()" id="logout-btn" style="display:none;">Выход</button>
            </div>
        </div>

        <!-- Auth Screen -->
        <div id="auth-screen" class="screen active">
            <div class="auth-box">
                <h2 id="auth-title">Вход в Volt</h2>
                <div id="auth-error" class="error-msg"></div>
                <div class="input-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="auth-username" placeholder="Введите имя...">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="auth-password" placeholder="Введите пароль...">
                </div>
                <button class="btn" id="auth-submit" onclick="handleAuth()">Войти</button>
                <div class="auth-switch" onclick="toggleAuthMode()">
                    Нет аккаунта? <span id="auth-switch-text">Зарегистрироваться</span>
                </div>
            </div>
        </div>

        <!-- Messenger Screen -->
        <div id="messenger-screen" class="screen">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="user-avatar" id="my-avatar-btn" onclick="openProfileModal()" title="Настроить профиль">
                        <span id="my-initials">N</span>
                    </div>
                    <div class="user-info">
                        <div class="user-name" id="my-username">Имя</div>
                        <div class="user-uid-badge" id="my-uid">UID: -----</div>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <input type="text" id="contact-uid-input" placeholder="Введите UID...">
                    <button class="icon-btn" onclick="addContact()" title="Добавить контакт">+</button>
                </div>
                <div class="contacts-list" id="contacts-list">
                    <!-- Contacts -->
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area" id="chat-area">
                <div class="empty-placeholder" id="chat-placeholder" style="display: flex;">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span>Выберите чат из списка</span>
                </div>
                <div id="active-chat-container" style="display: none; flex: 1; flex-direction: column; height: 100%;">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <button class="back-btn" onclick="closeChatMobile()">← Назад</button>
                            <div class="user-avatar" id="active-chat-avatar" style="width: 32px; height: 32px; font-size: 12px;">U</div>
                            <div>
                                <div class="user-name" id="active-chat-name">Имя контакта</div>
                                <div class="user-uid-badge" id="active-chat-uid">UID</div>
                            </div>
                        </div>
                    </div>
                    <div class="chat-messages" id="chat-messages">
                        <!-- Messages -->
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="message-input" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendMessage()">
                        <button class="btn" onclick="sendMessage()">Отправить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profile-modal">
        <div class="modal-box">
            <h3>Профиль</h3>
            <div class="avatar-preview" onclick="document.getElementById('avatar-file-input').click()" title="Загрузить фото">
                <img id="modal-avatar-img" style="display:none;">
                <span id="modal-avatar-initials" style="font-size: 22px; color: var(--accent);">N</span>
            </div>
            <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
            <div class="input-group">
                <label>Статус</label>
                <input type="text" id="profile-status-input" placeholder="Ваш статус...">
            </div>
            <button class="btn" onclick="saveProfile()">Сохранить</button>
            <button class="tb-btn" onclick="closeProfileModal()" style="text-align: center;">Отмена</button>
        </div>
    </div>

    <script>
        let isRegisterMode = false;
        let currentUser = null;
        let currentContact = null;
        let socket = null;
        let contacts = [];

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? 'Регистрация в Volt' : 'Вход в Volt';
            document.getElementById('auth-submit').innerText = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('auth-switch-text').innerText = isRegisterMode ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('auth-error').innerText = '';
        }

        async function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errEl = document.getElementById('auth-error');

            if (!username || !password) {
                errEl.innerText = 'Заполните все поля';
                return;
            }

            const endpoint = isRegisterMode ? '/api/register' : '/api/login';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();

                if (!res.ok) {
                    errEl.innerText = data.error || 'Ошибка';
                    return;
                }

                currentUser = data;
                initSession();
            } catch (e) {
                errEl.innerText = 'Ошибка соединения';
            }
        }

        function initSession() {
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('messenger-screen').classList.add('active');
            document.getElementById('logout-btn').style.display = 'block';

            updateUserInterface();
            initSocket();
            loadContacts();
        }

        function updateUserInterface() {
            document.getElementById('my-username').innerText = currentUser.username;
            document.getElementById('my-uid').innerText = `UID: ${currentUser.uid}`;
            const initials = currentUser.username.charAt(0).toUpperCase();
            document.getElementById('my-initials').innerText = initials;

            if (currentUser.avatar) {
                document.getElementById('my-avatar-btn').innerHTML = `<img src="${currentUser.avatar}">`;
            }
        }

        function initSocket() {
            socket = io();
            socket.emit('join', { uid: currentUser.uid });

            socket.on('receive_message', (data) => {
                if (currentContact && (data.sender_uid === currentContact.uid || data.receiver_uid === currentContact.uid)) {
                    appendMessageToChat(data);
                }
            });
        }

        async function loadContacts() {
            try {
                const res = await fetch(`/api/contacts/${currentUser.uid}`);
                const data = await res.json();
                contacts = data.contacts || [];
                renderContacts();
            } catch (e) {
                console.error(e);
            }
        }

        function renderContacts() {
            const listEl = document.getElementById('contacts-list');
            listEl.innerHTML = '';

            if (contacts.length === 0) {
                listEl.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 12px;">Нет контактов</div>';
                return;
            }

            contacts.forEach(c => {
                const item = document.createElement('div');
                item.className = `contact-item ${currentContact && currentContact.uid === c.uid ? 'active' : ''}`;
                item.onclick = () => selectContact(c);
                
                const avatarHtml = c.avatar ? `<img src="${c.avatar}">` : c.username.charAt(0).toUpperCase();

                item.innerHTML = `
                    <div class="user-avatar" style="width: 36px; height: 36px; font-size: 13px;">${avatarHtml}</div>
                    <div class="contact-details">
                        <div class="contact-name">${c.username}</div>
                        <div class="contact-status">${c.status || 'UID: ' + c.uid}</div>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        async function addContact() {
            const targetUid = document.getElementById('contact-uid-input').value.trim();
            if (!targetUid) return;

            try {
                const res = await fetch('/api/contacts/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_uid: currentUser.uid, target_uid: targetUid })
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Ошибка');
                    return;
                }

                document.getElementById('contact-uid-input').value = '';
                loadContacts();
            } catch (e) {
                alert('Ошибка соединения');
            }
        }

        async function selectContact(contact) {
            currentContact = contact;
            renderContacts();

            document.getElementById('chat-placeholder').style.display = 'none';
            document.getElementById('active-chat-container').style.display = 'flex';
            document.getElementById('chat-area').classList.add('mobile-active');

            document.getElementById('active-chat-name').innerText = contact.username;
            document.getElementById('active-chat-uid').innerText = `UID: ${contact.uid}`;
            
            const avatarContainer = document.getElementById('active-chat-avatar');
            if (contact.avatar) {
                avatarContainer.innerHTML = `<img src="${contact.avatar}">`;
            } else {
                avatarContainer.innerText = contact.username.charAt(0).toUpperCase();
            }

            loadMessages();
        }

        function closeChatMobile() {
            document.getElementById('chat-area').classList.remove('mobile-active');
            currentContact = null;
            renderContacts();
        }

        async function loadMessages() {
            if (!currentContact) return;
            try {
                const res = await fetch(`/api/messages/${currentUser.uid}/${currentContact.uid}`);
                const data = await res.json();
                
                const messagesEl = document.getElementById('chat-messages');
                messagesEl.innerHTML = '';
                
                (data.messages || []).forEach(msg => {
                    appendMessageToChat(msg);
                });
            } catch (e) {
                console.error(e);
            }
        }

        function appendMessageToChat(msg) {
            const messagesEl = document.getElementById('chat-messages');
            const isOutgoing = msg.sender_uid === currentUser.uid;
            
            const div = document.createElement('div');
            div.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
            
            let text = msg.encrypted_content;
            try {
                if (text.startsWith('ENC:')) {
                    text = atob(text.substring(4));
                }
            } catch(e) {}

            div.innerHTML = `
                <div>${escapeHtml(text)}</div>
                <div class="message-time">${new Date(msg.timestamp || Date.now()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
            `;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentContact) return;

            const encrypted_content = 'ENC:' + btoa(text);

            socket.emit('send_message', {
                sender_uid: currentUser.uid,
                receiver_uid: currentContact.uid,
                encrypted_content: encrypted_content
            });

            input.value = '';
        }

        function openProfileModal() {
            document.getElementById('profile-modal').classList.add('active');
            document.getElementById('profile-status-input').value = currentUser.status || '';
            const img = document.getElementById('modal-avatar-img');
            const initials = document.getElementById('modal-avatar-initials');
            
            if (currentUser.avatar) {
                img.src = currentUser.avatar;
                img.style.display = 'block';
                initials.style.display = 'none';
            } else {
                img.style.display = 'none';
                initials.style.display = 'block';
                initials.innerText = currentUser.username.charAt(0).toUpperCase();
            }
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.remove('active');
        }

        function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentUser.avatar = e.target.result;
                const img = document.getElementById('modal-avatar-img');
                img.src = currentUser.avatar;
                img.style.display = 'block';
                document.getElementById('modal-avatar-initials').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        async function saveProfile() {
            const status = document.getElementById('profile-status-input').value.trim();
            currentUser.status = status;

            try {
                await fetch('/api/profile/update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ uid: currentUser.uid, avatar: currentUser.avatar, status: status })
                });
                updateUserInterface();
                closeProfileModal();
            } catch (e) {
                alert('Ошибка');
            }
        }

        function logout() {
            currentUser = null;
            currentContact = null;
            if (socket) socket.disconnect();
            document.getElementById('messenger-screen').classList.remove('active');
            document.getElementById('auth-screen').classList.add('active');
            document.getElementById('logout-btn').style.display = 'none';
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>

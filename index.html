<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volt Messenger</title>
    <style>
        body {
            background: #0d0d12;
            color: #f0f0f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            background: rgba(26, 26, 33, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h2>Подключение к Volt...</h2>
        <p style="color: #8e8e99; font-size: 13px; margin-top: 8px;">Связываемся с сервером...</p>
    </div>

    <script>
        // Ссылка на файл url.txt в вашем репозитории
        const TUNNEL_URL_FILE = "https://raw.githubusercontent.com/voltmsg/volt/main/url.txt";

        async function connect() {
            try {
                const res = await fetch(TUNNEL_URL_FILE + "?r=" + Math.random());
                if (!res.ok) throw new Error();
                const tunnelUrl = (await res.text()).trim();

                if (tunnelUrl.startsWith('http')) {
                    // Важный момент: запрашиваем туннель со специальным заголовком обхода IP
                    const check = await fetch(tunnelUrl, {
                        method: 'GET',
                        mode: 'no-cors', 
                        headers: {
                            'Bypass-Tunnel-Reminder': 'true'
                        }
                    });

                    // Перенаправляем пользователя на актуальный адрес
                    window.location.replace(tunnelUrl);
                    return;
                }
            } catch (e) {
                document.querySelector('p').innerText = "Ожидание запуска сервера...";
            }
        }

        connect();
        setInterval(connect, 4000);
    </script>
</body>
</html>
